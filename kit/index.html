"use strict";
let K = JSON.parse(document.getElementById("kit").textContent);
const STORE = "kit_" + K.id + "_v1", MAXL = 60;
const $ = id => document.getElementById(id);
function el(tag, props, ...kids) { const e = document.createElement(tag); if (props) Object.assign(e, props); kids.forEach(k => k != null && e.append(k)); return e; }
const fmt = n => "NT$" + Number(n || 0).toLocaleString("en-US");
// 和報價網站購物車同一套品項代碼（分類｜品牌｜品名）
function itemKey(it) { let x = 2166136261; const s = it.cat + "|" + it.b + "|" + it.l; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return (x >>> 0).toString(36); }
const prep = () => K.steps.forEach(s => (s.g || []).forEach((g, gi) => { g.key = s.id + ":" + gi; g.items.forEach(it => it.k = itemKey(it)); }));
prep();
const groups = () => K.steps.flatMap(s => (s.g || []).map(g => ({ s, g })));

// 狀態：car、pick[群組] = [品項代碼...]、own[群組] = true（已經有了）
let S = { wb: "", pick: {}, own: {}, at: 0 };
try { const o = JSON.parse(localStorage.getItem(STORE) || "null"); if (o && typeof o === "object") S = Object.assign(S, o); } catch (e) {}
delete S.car; if (!K.wb.some(w => w.id === S.wb)) S.wb = "";
const wbName = id => { const w = K.wb.find(x => x.id === id); return w ? w.t : ""; };
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} };
const fits = it => !S.wb || !it.w.length || it.w.includes(S.wb);
const visible = g => g.items.filter(fits);
function picked(g) { const ks = S.pick[g.key] || []; return g.items.filter(it => ks.includes(it.k) && fits(it)); }
const decided = g => picked(g).length > 0 || !!S.own[g.key];
function stepDone(s) {
  if (s.type === "car") return !!S.wb;
  if (s.type === "sum") return false;
  const gs = (s.g || []).filter(g => visible(g).length);
  if (!gs.some(g => g.need)) return gs.some(decided);              // 全部是選配：有挑零件或按「不需要」才打勾
  return gs.every(g => !g.need || decided(g));
}
function allPicked() { return groups().flatMap(({ s, g }) => picked(g).map(it => ({ s, g, it }))); }
function total() { return allPicked().reduce((t, x) => t + x.it.p, 0); }
const needsCh2 = () => allPicked().some(x => /遙控器不相容|需搭配有 ?CH2|需另備有 ?CH2/.test(x.it.note));

function toggle(g, it) {
  const ks = (S.pick[g.key] || []).filter(k => g.items.some(x => x.k === k && fits(x)));
  const i = ks.indexOf(it.k);
  if (i >= 0) ks.splice(i, 1); else if (g.multi) ks.push(it.k); else ks.splice(0, ks.length, it.k);
  S.pick[g.key] = ks; if (ks.length) delete S.own[g.key];
  save(); render(true);
}
function setOwn(g) {
  if (S.own[g.key]) delete S.own[g.key]; else { S.own[g.key] = true; S.pick[g.key] = []; }
  save(); render(true);
}

function stepsBar() {
  const bar = $("steps"); bar.replaceChildren();
  K.steps.forEach((s, i) => {
    const b = el("button", { type: "button", className: (i === S.at ? "on " : "") + (stepDone(s) ? "done" : "") }, el("i", { textContent: stepDone(s) ? "✓" : String(i + 1) }), s.t);
    b.addEventListener("click", () => go(i));
    bar.append(b);
  });
  const on = bar.children[S.at]; if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
}

function optCard(g, it) {
  const sel = picked(g).includes(it);
  const b = el("button", { type: "button", className: "op" + (sel ? " sel" : "") });
  b.setAttribute("aria-pressed", sel ? "true" : "false");
  b.append(it.img ? el("img", { className: "im", src: it.img, alt: it.n, loading: "lazy", referrerPolicy: "no-referrer" }) : el("div", { className: "ph", textContent: "🔧" }));
  b.append(el("span", { className: "ck", textContent: "✓" }));
  b.append(el("span", { className: "nm", textContent: it.n }));
  const meta = [it.s, it.sku, it.w.length ? it.w.map(wbName).join("／") + " 專用" : ""].filter(Boolean).join("｜");
  if (meta) b.append(el("span", { className: "ms", textContent: meta }));
  b.append(el("span", { className: "row" }, el("span", { className: "pr", textContent: fmt(it.p) }), el("span", { className: "st" + (it.st === "現貨" ? " ok" : ""), textContent: it.st })));
  if (it.slug) { const a = el("a", { className: "more", href: "../p/" + it.slug + ".html", target: "_blank", rel: "noopener", textContent: "看詳細" }); a.addEventListener("click", e => e.stopPropagation()); b.append(a); }
  if (it.note) b.title = it.note;
  b.addEventListener("click", () => toggle(g, it));
  return b;
}

function groupView(g, showMiss) {
  const vis = visible(g);
  const ok = decided(g);
  const box = el("div", { className: "grp" + (showMiss && g.need && !ok && vis.length ? " miss" : "") });
  box.append(el("div", { className: "gh" }, el("b", { textContent: g.n }),
    el("span", { className: "tag" + (g.need ? (ok ? " ok" : " need") : ""), textContent: g.need ? (ok ? "已完成" : "必選") : (g.multi ? "選配・可複選" : "選配") }),
    g.multi && g.need ? el("span", { className: "tag", textContent: "可複選" }) : null));
  if (!vis.length) { box.append(el("p", { className: "hint", textContent: "這台車目前沒有適用的商品。" })); return box; }
  const grid = el("div", { className: "opts" });
  const own = el("button", { type: "button", className: "op none" + (S.own[g.key] ? " sel" : ""), textContent: g.need ? "已經有了／用原廠" : "不需要" });
  own.append(el("span", { className: "ck", textContent: "✓" }));
  own.addEventListener("click", () => setOwn(g));
  grid.append(own, ...vis.map(it => optCard(g, it)));
  box.append(grid);
  return box;
}

let tried = false;
function view(keepScroll) {
  const s = K.steps[S.at], v = $("view"); v.replaceChildren();
  v.append(el("div", { className: "sh" }, el("h2", { textContent: s.t }), el("small", { textContent: "第 " + (S.at + 1) + "／" + K.steps.length + " 步" })));
  if (s.d) v.append(el("p", { className: "sd", textContent: s.d }));
  if (s.type === "car") {
    const g = el("div", { className: "cars" });
    K.wb.forEach(w => {
      const b = el("button", { type: "button", className: "op wb" + (S.wb === w.id ? " sel" : "") },
        el("b", { textContent: w.t }), el("span", { className: "wn", textContent: w.n }), el("small", { textContent: "原廠車型參考：" + w.ref }));
      b.append(el("span", { className: "ck", textContent: "✓" }));
      b.addEventListener("click", () => { S.wb = w.id; save(); render(true); setTimeout(() => go(S.at + 1), 180); });
      g.append(b);
    });
    v.append(g);
  } else if (s.type === "sum") {
    v.append(summary());
  } else {
    if (s.id === "radio" && needsCh2()) v.append(el("div", { className: "warn", textContent: "你選的動力需要有 CH2 的遙控設備，原廠遙控器不相容，記得在這一步挑遙控器與接收機。" }));
    if (!S.wb) v.append(el("div", { className: "hint", textContent: "還沒選軸距，下面列出全部零件。建議先回第 1 步選軸距，只看適用的。" }));
    s.g.forEach(g => v.append(groupView(g, tried)));
  }
  if (!keepScroll) window.scrollTo({ top: Math.max(0, $("steps").offsetTop - 2), behavior: "smooth" });
}

function summary() {
  const box = el("div");
  const lines = [], miss = [];
  K.steps.forEach((s, si) => (s.g || []).forEach(g => {
    const ps = picked(g);
    if (ps.length) ps.forEach(it => lines.push({ si, g, it }));
    else if (S.own[g.key]) lines.push({ si, g, own: true });
    else if (g.need && visible(g).length) { lines.push({ si, g, miss: true }); miss.push(g.n); }
  }));
  box.append(el("p", { className: "sd", textContent: K.short + (S.wb ? " " + wbName(S.wb) + (S.wb === "short" ? "" : " 軸距") : "（未選軸距）") + "，共 " + allPicked().length + " 項零件。" }));
  if (miss.length) box.append(el("div", { className: "warn", textContent: "還沒決定：" + miss.join("、") + "。一台車需要這些零件，可以回去挑選，或按「已經有了」。" }));
  if (S.wb && allPicked().some(x => x.it.w.length && !x.it.w.includes(S.wb))) box.append(el("div", { className: "warn", textContent: "清單裡有不適用這個軸距的零件，請檢查。" }));
  const list = el("div", { className: "sum" });
  lines.forEach(x => {
    const r = el("div", { className: "r" + (x.own ? " own" : "") + (x.miss ? " miss" : "") });
    if (x.it) r.append(x.it.img ? el("img", { src: x.it.img, alt: "", loading: "lazy", referrerPolicy: "no-referrer" }) : el("span"));
    r.append(el("div", { className: "t" }, el("small", { textContent: x.g.n }), el("b", { textContent: x.it ? x.it.n : x.own ? "已經有了／用原廠" : "尚未選擇" })));
    if (x.it) r.append(el("span", { className: "p", textContent: fmt(x.it.p) }));
    const e = el("button", { type: "button", textContent: "修改" }); e.addEventListener("click", () => go(x.si)); r.append(e);
    list.append(r);
  });
  if (!lines.length) list.append(el("div", { className: "r" }, el("div", { className: "t" }, el("b", { textContent: "還沒有選任何零件。" }))));
  list.append(el("div", { className: "tot" }, el("span", { textContent: "合計（未含運費）" }), el("b", { textContent: fmt(total()) })));
  box.append(list);
  const keys = allPicked().map(x => x.it.k);
  const uniq = keys.filter((k, i) => keys.indexOf(k) === i).slice(0, MAXL);
  const link = location.origin + new URL("../", location.href).pathname + "#list=" + uniq.join(".");
  const add = el("a", { className: "btn pri", href: uniq.length ? "../#list=" + uniq.join(".") : "#", textContent: "全部加入購物車" });
  if (!uniq.length) { add.setAttribute("aria-disabled", "true"); add.style.opacity = ".45"; add.addEventListener("click", e => e.preventDefault()); }
  const msg = el("p", { className: "msg" });
  const share = el("button", { className: "btn", type: "button", textContent: "複製清單連結（傳給朋友或 LINE 詢問）", disabled: !uniq.length });
  share.addEventListener("click", async () => {
    if (navigator.share) { try { await navigator.share({ title: "我的 " + K.short + " 自組清單", url: link }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(link); msg.textContent = "已複製連結，打開就是同一份清單。"; } catch (e) { msg.textContent = "請手動複製：" + link; }
  });
  box.append(el("div", { className: "acts" }, add, share), msg);
  box.append(el("p", { className: "hint", textContent: "加入購物車後，到報價網站確認數量、填寫資料就能下單。零件相容性有疑問，歡迎在 LINE 官方帳號詢問。" }));
  return box;
}

function bar() {
  const n = allPicked().length, last = S.at === K.steps.length - 1;
  $("bTotal").textContent = fmt(total());
  $("bInfo").textContent = n ? "已選 " + n + " 項零件" : "尚未選擇零件";
  $("bPrev").hidden = S.at === 0;
  $("bNext").hidden = last;
  $("bNext").textContent = S.at === K.steps.length - 2 ? "看清單" : "下一步";
}
function render(keepScroll) { stepsBar(); view(keepScroll); bar(); }
function go(i) { S.at = Math.max(0, Math.min(K.steps.length - 1, i)); tried = false; save(); render(); }
$("bPrev").onclick = () => go(S.at - 1);
$("bNext").onclick = () => {
  const s = K.steps[S.at];
  if (!stepDone(s) && !tried) {
    tried = true; render(true);
    const m = document.querySelector(".grp.miss") || document.querySelector(".cars");
    if (m) m.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  go(S.at + 1);
};
$("reset").onclick = () => { if (confirm("確定全部重選？")) { S = { wb: "", pick: {}, own: {}, at: 0 }; save(); render(); } };
if (S.at >= K.steps.length) S.at = 0;
render(true);
// 手機瀏覽器可能拿到舊的快取頁面：背景抓最新版，商品有變就更新畫面（已選的零件保留）
(async () => {
  try {
    const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    const t = doc.getElementById("kit"); if (!t || t.textContent === document.getElementById("kit").textContent) return;
    K = JSON.parse(t.textContent); prep(); document.getElementById("kit").textContent = t.textContent;
    if (S.at >= K.steps.length) S.at = 0;
    render(true);
  } catch (e) {}
})();
})();
</script>
</body></html>
