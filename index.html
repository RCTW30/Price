<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Axial SCX30 改裝零件報價系統</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#14213d;--mute:#5d6b82;--line:#d5dbe4;--accent:#1f5eff;--accent-ink:#fff;--price:#0b7a4b;--danger:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--panel:#18213a;--ink:#e8edf7;--mute:#97a4bd;--line:#2c3856;--accent:#6b97ff;--accent-ink:#0f1624;--price:#4fd69a;--danger:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:28px 16px 120px}
h1{font-size:clamp(24px,5vw,36px);font-weight:900;letter-spacing:.02em;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:130px 1fr 210px;gap:12px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.cat{font-weight:700;font-size:17px;padding-top:9px}
select,input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
select{width:100%}
input{width:100%}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select:disabled{opacity:.55;cursor:not-allowed}
.pickrow{display:flex;gap:8px}
.pickrow select:first-child{flex:0 0 150px;width:150px}
.pickrow select:last-child{flex:1;min-width:0}
.detail{margin:8px 2px 0;color:var(--mute);font-size:13px;display:flex;gap:12px;align-items:flex-start}
.detail:empty{display:none}
.detail .txt{white-space:pre-line;word-break:break-word;min-width:0;flex:1}
.thumb{flex:none;width:104px;height:104px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
.line .thumb{width:56px;height:56px}
.line .who{display:flex;gap:12px;align-items:center;min-width:0}
.buy{display:flex;flex-direction:column;gap:8px}
.price{text-align:right;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--price);padding-top:6px}
.price.empty{color:var(--mute);font-weight:400;font-size:18px}
.buyrow{display:flex;gap:8px}
.qty{width:76px;flex:none;text-align:center;padding:10px 4px}
button{font:inherit;font-weight:500;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.buyrow button{flex:1;padding:0 8px}
.note{color:var(--mute);font-size:13px;margin:14px 0 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.ver{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.foot button{min-height:36px;padding:0 14px;font-size:14px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.cartbar .in{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cartbar strong{font-size:22px;margin-left:10px;font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;width:min(640px,94vw);background:var(--panel);color:var(--ink);overflow:hidden}
dialog::backdrop{background:rgba(10,16,30,.55)}
.dwrap{display:flex;flex-direction:column;max-height:88vh}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dhead h2{margin:0;font-size:20px}
.dbody{overflow:auto;flex:1;min-height:0}
.empty-cart{padding:32px 18px;text-align:center;color:var(--mute)}
.line{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center}
.line .name{font-weight:700;word-break:break-word}
.line .meta{color:var(--mute);font-size:13px}
.line .meta.bad{color:var(--danger)}
.line .sub2{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--price)}
.line .sub2 small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.stepper{display:flex;gap:6px;align-items:center}
.stepper button{min-height:36px;width:36px;padding:0}
.stepper input{width:64px;min-height:36px;text-align:center;padding:4px}
.line .del{justify-self:end;min-height:36px;font-size:14px}
.dfoot{padding:14px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.dtotal{display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.dtotal strong{font-size:28px;font-variant-numeric:tabular-nums;color:var(--price)}
.dbtns{display:flex;gap:8px;flex-wrap:wrap}
.dmsg{font-size:13px;color:var(--mute);min-height:18px}
.lnote{grid-column:1/-1;min-height:40px;font-size:15px;padding:8px 10px}
.contact{padding:16px 18px;display:grid;gap:10px}
.contact h3{margin:0;font-size:17px}
.contact label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.contact textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.contact textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.dfoot textarea{width:100%;height:120px;font:13px monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
@media (max-width:620px){
 .row{grid-template-columns:1fr auto;grid-template-areas:"c p" "s s" "b b"}
 .cat{grid-area:c;padding-top:0}.pick{grid-area:s}
 .buy{display:contents}.price{grid-area:p;padding-top:0}.buyrow{grid-area:b}
 .pickrow{flex-direction:column}.pickrow select:first-child{flex:none;width:100%}
}
</style>
</head>
<body>
<main>
  <h1>Axial SCX30 改裝零件報價系統</h1>
  <p class="sub">選擇品牌與品項、輸入數量，按「加入購物車」，再到購物車檢視全部內容與合計（新台幣）。</p>
  <div class="card" id="list"><div class="row">載入中…</div></div>
  <p class="note" id="footnote"></p>
  <p class="note">價格僅供參考，實際金額以現場報價為準。</p>
  <div class="foot">
    <span class="ver" id="ver">版本載入中…</span>
    <button id="force" type="button">強制重新整理</button>
  </div>
</main>

<div class="cartbar"><div class="in">
  <div><span id="cbCount">購物車 0 件</span><strong id="cbTotal">NT$ 0</strong></div>
  <button id="cartOpen" type="button" class="primary">檢視購物車</button>
</div></div>

<dialog id="cart" aria-labelledby="cartTitle"><div class="dwrap">
  <div class="dhead"><h2 id="cartTitle">購物車</h2><button id="cartClose" type="button">關閉</button></div>
  <div class="dbody" id="cartBody">
    <div id="cartLines"></div>
    <div class="contact">
      <h3>聯絡資料與備註</h3>
      <label>姓名／稱呼<input id="cName" maxlength="40" autocomplete="name"></label>
      <label>聯絡方式（電話、LINE ID 或 Email）<input id="cContact" maxlength="80" autocomplete="off"></label>
      <label>其他備註（例如：想要的顏色、交貨時間）<textarea id="cRemark" maxlength="300" rows="3"></textarea></label>
      <input id="cHp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    </div>
  </div>
  <div class="dfoot">
    <div class="dtotal"><span>合計</span><strong id="cartTotal">NT$ 0</strong></div>
    <div class="dbtns">
      <button id="cartSend" type="button" class="primary" hidden>送出訂單</button>
      <button id="cartCopy" type="button" class="primary">複製訂單內容</button>
      <button id="cartClear" type="button" class="danger">清空購物車</button>
    </div>
    <div class="dmsg" id="cartMsg"></div>
  </div>
</div></dialog>

const PAGE_VERSION = "v3.2"; // 網頁程式有改動時，請手動調高這個版本號
const EMBED = JSON.parse($("data").textContent);
const NO_BRAND = "其他", MAXQ = 99, CART_KEY = "injora_cart_v1", CONTACT_KEY = "injora_contact_v1";
// 訂單後台網址：填入 Google Apps Script 網頁應用程式網址（或其他接收 POST 的網址）後，購物車會出現「送出訂單」。留空就只有「複製訂單內容」。
const ORDER_ENDPOINT = "https://script.google.com/macros/s/AKfycbyFyfzId_sfVWiiSOylGzvNSjED6ogTNArkLXe_knjgWuld6S-QU14loyX87CJH-r_j/exec";
const brandOf = it => it.brand || NO_BRAND;
// 商品圖片：資料裡的 image 是 injora.com 圖檔名，這裡接上圖片網址；沒有圖片或載入失敗時就不顯示
const imgUrl = it => (it && it.image) ? ((data.imageBase || "") + it.image + "&width=400") : "";
function thumb(it) {
  const u = imgUrl(it); if (!u) return null;
  const im = el("img", { className: "thumb", src: u, alt: it.label, loading: "lazy", referrerPolicy: "no-referrer" });
  im.addEventListener("error", () => im.remove());
  return im;
}
const clampQ = v => Math.min(MAXQ, Math.max(1, parseInt(v, 10) || 1));
let data = EMBED, rows = [], cart = loadCart();

/* ---------- 購物車資料（存在客人自己的瀏覽器，重新整理後還在） ---------- */
function loadCart() {
  try { const a = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); return Array.isArray(a) ? a.filter(x => x && x.label && x.qty > 0) : []; }
  catch (e) { return []; }
}
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} }
// 購物車只記「分類、品牌、品名、數量」，價格每次都從最新的價格資料查，所以調價後購物車會自動跟著變
function findItem(c) {
  const cat = data.categories.find(x => x.name === c.cat);
  return cat && cat.items.find(it => brandOf(it) === c.brand && it.label === c.label);
}
const cartLines = () => cart.map(c => ({ c, it: findItem(c) }));
function cartTotals() {
  let count = 0, total = 0;
  cartLines().forEach(({ c, it }) => { if (it) { count += c.qty; total += it.price * c.qty; } });
  return { count, total };
}

/* ---------- 價格資料更新 ---------- */
async function loadData() {
  const r = await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), "text/html");
  return JSON.parse(doc.getElementById("data").textContent);
}
async function refresh() { try { render(await loadData()); } catch (e) { /* 讀取失敗時維持內建價格 */ } }

/* ---------- 選品區 ---------- */
function fillItems(row, want) {
  const b = row.bsel.value;
  row.shown = b ? row.cat.items.filter(it => brandOf(it) === b) : [];   // 只列出所選品牌的品項
  row.sel.replaceChildren(el("option", { value: "", textContent: b ? "請選擇品項" : "請先選擇品牌" }));
  row.shown.forEach((it, i) => row.sel.append(el("option", { value: i, textContent: it.label })));
  row.sel.disabled = !b;
  const idx = want ? row.shown.findIndex(it => it.label === want) : -1;
  row.sel.value = idx >= 0 ? String(idx) : "";
}
function render(raw) {
  data = raw;
  $("ver").textContent = "網頁 " + PAGE_VERSION + "　價格 v" + raw.version + "（更新於 " + raw.updated + "）";
  $("footnote").textContent = raw.footnote || "";
  const keep = {};
  rows.forEach(r => { const it = r.sel.value === "" ? null : r.shown[+r.sel.value]; keep[r.cat.name] = { brand: r.bsel.value, label: it ? it.label : "", qty: r.qty.value }; });
  const list = $("list"); list.replaceChildren(); rows = [];
  raw.categories.forEach((cat, ci) => {
    const brands = [...new Set(cat.items.map(brandOf))];
    const bsel = el("select", { id: "brand" + ci }, el("option", { value: "", textContent: "請選擇品牌" }));
    bsel.setAttribute("aria-label", cat.name + "的品牌");
    brands.forEach(b => bsel.append(el("option", { value: b, textContent: b })));
    const sel = el("select", { id: "cat" + ci });
    sel.setAttribute("aria-label", cat.name + "的品項");
    const detail = el("div", { className: "detail" });
    const price = el("div", { className: "price empty", textContent: "—" });
    price.setAttribute("aria-live", "polite");
    const k = keep[cat.name];
    const qty = el("input", { id: "qty" + ci, className: "qty", type: "number", min: 1, max: MAXQ, step: 1, value: (k && k.qty) || 1 });
    qty.setAttribute("inputmode", "numeric"); qty.setAttribute("aria-label", cat.name + "的數量");
    const add = el("button", { className: "primary", type: "button", textContent: "加入購物車", disabled: true });
    const row = { cat, brands, bsel, sel, qty, add, price, detail, shown: [] };
    if (brands.length === 1) bsel.value = brands[0];                    // 這個分類只有一個品牌時自動選好
    else if (k && brands.includes(k.brand)) bsel.value = k.brand;
    fillItems(row, k && k.label);
    bsel.addEventListener("change", () => { fillItems(row); updateRows(); });
    sel.addEventListener("change", updateRows);
    qty.addEventListener("input", updateRows);
    qty.addEventListener("change", () => { qty.value = clampQ(qty.value); updateRows(); });
    add.addEventListener("click", () => addToCart(row));
    list.append(el("div", { className: "row" },
      el("label", { className: "cat", htmlFor: "brand" + ci, textContent: cat.name }),
      el("div", { className: "pick" }, el("div", { className: "pickrow" }, bsel, sel), detail),
      el("div", { className: "buy" }, price, el("div", { className: "buyrow" }, qty, add))));
    rows.push(row);
  });
  updateRows();
  renderCart();
}
function updateRows() {
  rows.forEach(({ sel, shown, qty, add, price, detail }) => {
    if (sel.value === "") { price.textContent = "—"; price.className = "price empty"; detail.replaceChildren(); delete detail.dataset.key; add.disabled = true; return; }
    const it = shown[+sel.value], q = clampQ(qty.value);
    price.textContent = fmt(it.price * q); price.className = "price"; add.disabled = false;
    const txt = ["單價：" + fmt(it.price) + " × " + q, it.sku && "型號：" + it.sku, it.color && "顏色：" + it.color, it.usd && "官網價：" + it.usd, it.note && "備註：" + it.note].filter(Boolean).join("\n");
    if (detail.dataset.key !== it.label) {                              // 換品項才重畫圖片，改數量時不閃爍
      detail.dataset.key = it.label;
      detail.replaceChildren(...[thumb(it), el("div", { className: "txt" })].filter(Boolean));
    }
    detail.querySelector(".txt").textContent = txt;
  });
}
function addToCart(row) {
  if (row.sel.value === "") return;
  const it = row.shown[+row.sel.value], q = clampQ(row.qty.value), brand = brandOf(it);
  const hit = cart.find(c => c.cat === row.cat.name && c.brand === brand && c.label === it.label);
  if (hit) hit.qty = Math.min(MAXQ, hit.qty + q); else cart.push({ cat: row.cat.name, brand, label: it.label, qty: q });
  saveCart(); renderCart();
  row.sel.value = ""; row.qty.value = 1; updateRows();
  row.add.textContent = "已加入 ✓"; setTimeout(() => { row.add.textContent = "加入購物車"; }, 1200);
}

/* ---------- 購物車 ---------- */
function setQty(c, v) { c.qty = clampQ(v); saveCart(); renderCart(); }
function renderCart() {
  const { count, total } = cartTotals();
  $("cbCount").textContent = "購物車 " + count + " 件"; $("cbTotal").textContent = fmt(total); $("cartTotal").textContent = fmt(total);
  const body = $("cartLines"); body.replaceChildren();
  if (!cart.length) { body.append(el("div", { className: "empty-cart", textContent: "購物車是空的，先選幾樣品項加進來吧。" })); }
  cartLines().forEach(({ c, it }) => {
    const minus = el("button", { type: "button", textContent: "−", disabled: c.qty <= 1 }); minus.setAttribute("aria-label", "減少數量");
    const plus = el("button", { type: "button", textContent: "＋", disabled: c.qty >= MAXQ }); plus.setAttribute("aria-label", "增加數量");
    const inp = el("input", { type: "number", min: 1, max: MAXQ, value: c.qty }); inp.setAttribute("aria-label", c.label + " 數量");
    minus.onclick = () => setQty(c, c.qty - 1); plus.onclick = () => setQty(c, c.qty + 1);
    inp.onchange = () => setQty(c, inp.value);
    const lnote = el("input", { className: "lnote", maxLength: 100, value: c.note || "", placeholder: "這項的顏色／備註（例如：想要綠色）" });
    lnote.setAttribute("aria-label", c.label + " 的顏色或備註");
    lnote.addEventListener("input", () => { c.note = lnote.value; saveCart(); });   // 只存不重畫，避免輸入時失去游標
    const del = el("button", { className: "del danger", type: "button", textContent: "刪除" });
    del.onclick = () => { cart = cart.filter(x => x !== c); saveCart(); renderCart(); };
    body.append(el("div", { className: "line" },
      el("div", { className: "who" }, ...[thumb(it)].filter(Boolean), el("div", {}, el("div", { className: "name", textContent: c.label }),
        el("div", { className: "meta" + (it ? "" : " bad"), textContent: it ? c.brand + "｜" + c.cat : "此品項已下架或改名，不列入合計，請刪除" }))),
      el("div", { className: "sub2" }, it ? fmt(it.price * c.qty) : "—", it ? el("small", { textContent: "單價 " + fmt(it.price) }) : ""),
      el("div", { className: "stepper" }, minus, inp, plus), del, lnote));
  });
  $("cartCopy").disabled = !count; $("cartSend").disabled = !count; $("cartClear").disabled = !cart.length;
}
const contactEls = { name: $("cName"), contact: $("cContact"), remark: $("cRemark") };
function loadContact() { try { const o = JSON.parse(localStorage.getItem(CONTACT_KEY) || "{}"); for (const k in contactEls) contactEls[k].value = o[k] || ""; } catch (e) {} }
function saveContact() { try { localStorage.setItem(CONTACT_KEY, JSON.stringify({ name: contactEls.name.value, contact: contactEls.contact.value, remark: contactEls.remark.value })); } catch (e) {} }
Object.values(contactEls).forEach(e => e.addEventListener("input", saveContact));
function orderText() {
  const lines = cartLines().filter(x => x.it), { total } = cartTotals(), v = k => contactEls[k].value.trim();
  return ["Axial SCX30 改裝零件訂單", ""].concat(
    lines.map(({ c, it }, i) => (i + 1) + ". [" + c.brand + "] " + c.label + (it.sku ? "（" + it.sku + "）" : "") + " × " + c.qty + " = " + fmt(it.price * c.qty) + (c.note && c.note.trim() ? "\n   顏色／備註：" + c.note.trim() : "")),
    ["", "合計：" + fmt(total)],
    v("name") ? ["姓名：" + v("name")] : [], v("contact") ? ["聯絡方式：" + v("contact")] : [], v("remark") ? ["其他備註：" + v("remark")] : [],
    ["（價格版本 v" + data.version + "，更新於 " + data.updated + "）"]).join("\n");
}
function orderPayload() {
  const lines = cartLines().filter(x => x.it), { total } = cartTotals(), v = k => contactEls[k].value.trim();
  return { sentAt: new Date().toISOString(), priceVersion: data.version, pageVersion: PAGE_VERSION,
    name: v("name"), contact: v("contact"), remark: v("remark"), website: $("cHp").value,   // website 是防機器人的隱藏欄位，正常客人看不到也不會填
    items: lines.map(({ c, it }) => ({ category: c.cat, brand: c.brand, label: c.label, sku: it.sku || "", qty: c.qty, unitPrice: it.price, subtotal: it.price * c.qty, note: (c.note || "").trim() })),
    total, text: orderText() };
}
async function sendOrder() {
  const msg = $("cartMsg");
  if (!cartTotals().count) return;
  if (!contactEls.contact.value.trim()) { msg.textContent = "請先填寫聯絡方式，店家才能聯絡你。"; contactEls.contact.focus(); return; }
  $("cartSend").disabled = true; msg.textContent = "送出中…";
  try {
    const r = await fetch(ORDER_ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(orderPayload()) });
    const j = await r.json();
    if (!j.ok) { renderCart(); msg.textContent = "訂單沒有送出成功，請確認聯絡方式後再試一次，或改按「複製訂單內容」傳給店家。"; return; }
    cart = []; saveCart(); contactEls.remark.value = ""; saveContact();
    renderCart(); msg.textContent = "訂單已送出" + (j.id ? "（編號 " + j.id + "）" : "") + "，店家會用你留的聯絡方式與你確認。";
  } catch (e) {
    renderCart(); msg.textContent = "無法確認訂單是否送出成功，請不要重複送出，改按「複製訂單內容」傳給店家。";
  }
}
async function copyOrder() {
  const text = orderText(), msg = $("cartMsg");
  try { await navigator.clipboard.writeText(text); msg.textContent = "已複製，可以貼到 LINE 或訊息傳給店家。"; }
  catch (e) {
    const old = $("cartFallback"); if (old) old.remove();
    const ta = el("textarea", { id: "cartFallback", readOnly: true, value: text }); $("cartMsg").after(ta); ta.select();
    msg.textContent = "無法自動複製，請手動全選下面的文字複製。";
  }
}
const dlg = $("cart");
$("cartOpen").onclick = () => { $("cartMsg").textContent = ""; (dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", "")); };
$("cartClose").onclick = () => (dlg.close ? dlg.close() : dlg.removeAttribute("open"));
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // 點對話框外面也能關閉
$("cartCopy").onclick = copyOrder;
$("cartSend").onclick = sendOrder;
$("cartSend").hidden = !ORDER_ENDPOINT;
if (ORDER_ENDPOINT) $("cartCopy").classList.remove("primary");
loadContact();
$("cartClear").onclick = () => { if (confirm("確定清空購物車？")) { cart = []; saveCart(); renderCart(); } };

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
$("force").addEventListener("click", () => { location.href = location.pathname + "?r=" + Date.now(); });
if (location.search.startsWith("?r=")) history.replaceState(null, "", location.pathname);
render(EMBED);
refresh();
</script>
</body>
</html>
